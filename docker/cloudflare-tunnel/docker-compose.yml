services:
  relay:
    image: mahasamuha/constellation-relay:0.5.2
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl/wget in the runtime image (wget was removed for a CVE — see the
      # relay Dockerfile), so check via Node's own built-in fetch instead.
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16.14
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # Shares relay's network namespace so cloudflared's connection to the relay
    # arrives from 127.0.0.1 — required for TRUST_PROXY_PRESET=cloudflare-tunnel
    # to correctly identify the real client IP from CF-forwarded headers instead
    # of collapsing every request onto cloudflared's bridge-network IP (see
    # docs/self-hosted-cloudflare-tunnel.md). The tunnel's Public Hostname route
    # must point at localhost:3000, not relay:3000, to match.
    network_mode: "service:relay"
    depends_on:
      - relay

volumes:
  pgdata:
