name: Build constellation CLI

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            pkg_target: node24-linux-x64
            binary: constellation
            arch: amd64
          - os: macos-latest
            pkg_target: node24-macos-arm64
            binary: constellation
            arch: arm64
          - os: windows-latest
            pkg_target: node24-win-x64
            binary: constellation.exe
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Node 24 to match the pkg compilation target.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache pkg binaries
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.pkg-cache
          key: pkg-${{ matrix.pkg_target }}

      - name: Install dependencies
        run: npm ci

      # Single esbuild pass: bundles cli + node + shared + hub TypeScript directly to CJS.
      # Avoids workspace symlink resolution issues with tsup in CI.
      - name: Bundle to CJS
        shell: bash
        run: |
          VERSION=$(node -p 'require("./packages/cli/package.json").version')
          npx esbuild packages/cli/src/cli.ts \
            --bundle \
            --platform=node \
            --format=cjs \
            --external:*.node \
            --alias:@constellation/shared=./packages/shared/src/index.ts \
            --alias:@constellation/node/cli=./packages/node/src/cli.ts \
            --alias:@constellation/node/config=./packages/node/src/config.ts \
            --alias:@constellation/hub/cli=./packages/hub/src/cli.ts \
            "--define:__PKG_VERSION__=\"${VERSION}\"" \
            --outfile=cli-bundle.cjs

      # The hub forks this worker as a child process at runtime.
      # It must be a separate JS bundle (pkg cannot fork from within a compiled binary).
      - name: Bundle hub subnode worker
        shell: bash
        run: |
          mkdir -p hub
          npx esbuild packages/hub/src/subnode-worker.ts \
            --bundle \
            --platform=node \
            --format=cjs \
            --external:*.node \
            --alias:@constellation/shared=./packages/shared/src/index.ts \
            --outfile=hub/subnode-worker.cjs

      - name: Compile to native binary
        run: npx @yao-pkg/pkg cli-bundle.cjs --target ${{ matrix.pkg_target }} --output ${{ matrix.binary }}

      # ── Linux: package as .deb ────────────────────────────────────────────────

      - name: Package as deb (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          mkdir -p pkg-root/usr/local/bin/hub
          mkdir -p pkg-root/DEBIAN
          cp constellation pkg-root/usr/local/bin/constellation
          chmod 755 pkg-root/usr/local/bin/constellation
          cp hub/subnode-worker.cjs pkg-root/usr/local/bin/hub/subnode-worker.cjs
          cat > pkg-root/DEBIAN/control <<EOF
          Package: constellation-cli
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Joe Rybka <joe@joerybka.com>
          Description: Constellation CLI
           Connects your development tools to the Constellation relay.
          EOF
          dpkg-deb --build pkg-root "constellation-cli_${VERSION}_amd64.deb"

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: constellation-cli-linux
          path: constellation-cli_*_amd64.deb

      # ── macOS: package as .tar.gz ─────────────────────────────────────────────

      - name: Package as tar.gz (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          tar -czf "constellation-cli_${VERSION}_macos-arm64.tar.gz" constellation hub/subnode-worker.cjs

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: constellation-cli-macos
          path: constellation-cli_*_macos-arm64.tar.gz

      # ── Windows: package as .zip ──────────────────────────────────────────────

      - name: Package as zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = node -p "require('./packages/cli/package.json').version"
          Compress-Archive -Path constellation.exe, hub/subnode-worker.cjs -DestinationPath "constellation-cli_${VERSION}_windows-x64.zip"

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: constellation-cli-windows
          path: constellation-cli_*_windows-x64.zip

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: false

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: artifacts/**/*
