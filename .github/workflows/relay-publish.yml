name: Publish relay image

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: mahasamuha
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/constellation-relay
            mahasamuha/constellation-relay
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      # Build amd64 into the local daemon first so the image can be smoke-tested
      # before anything is pushed. Shares the GHA cache with the publish build below.
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: packages/relay/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: constellation-relay:smoke
          cache-from: type=gha

      # Without starting the relay (which needs a database): loads the shared logger, then
      # checks every runtime dependency of shared and relay is installed where Node's
      # resolution would find it. Presence is checked rather than import(), since some
      # packages (e.g. @modelcontextprotocol/sdk) only export subpaths. Catches packages
      # missing from the image, such as a workspace-nested dependency the runtime stage
      # didn't copy.
      - name: Smoke test image
        run: |
          docker run --rm --entrypoint node constellation-relay:smoke --input-type=module -e '
            import { existsSync, readFileSync } from "node:fs";
            import { dirname, join } from "node:path";
            await import("/app/packages/shared/dist/logger.js");
            const missing = [];
            for (const pkg of ["shared", "relay"]) {
              const base = `/app/packages/${pkg}`;
              const deps = Object.keys(JSON.parse(readFileSync(`${base}/package.json`, "utf8")).dependencies ?? {});
              for (const dep of deps) {
                let dir = base, found = false;
                for (;;) {
                  if (existsSync(join(dir, "node_modules", dep, "package.json"))) { found = true; break; }
                  if (dir === "/") break;
                  dir = dirname(dir);
                }
                if (!found) missing.push(`${pkg}: ${dep}`);
              }
            }
            if (missing.length) { console.error("missing from image:\n  " + missing.join("\n  ")); process.exit(1); }
            console.log("relay image runtime dependencies present");
          '

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: packages/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
