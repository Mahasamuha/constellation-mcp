<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <title>Constellation</title>

  <!--
    Favicon — baked-in dark background, optimized for 16–32px rendering.

    Hub inner color indicates connection state. Change the last circle's fill:
      Connected:    #5DCAA5
      Connecting:   #EF9F27
      Disconnected: #E24B4A
      Offline:      #888780

    Use as SVG favicon:
      <link rel="icon" type="image/svg+xml" href="favicon.svg">

    For ICO/PNG generation, rsvg-convert works well:
      rsvg-convert -w 32 -h 32 favicon.svg > favicon-32.png
      rsvg-convert -w 16 -h 16 favicon.svg > favicon-16.png
  -->

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#04342C"/>

  <!-- Connecting lines -->
  <g stroke="#5DCAA5" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7">
    <!-- Perimeter ring -->
    <line x1="5"  y1="17" x2="12" y2="5"/>
    <line x1="12" y1="5"  x2="24" y2="7"/>
    <line x1="24" y1="7"  x2="28" y2="16"/>
    <line x1="28" y1="16" x2="24" y2="25"/>
    <line x1="24" y1="25" x2="13" y2="28"/>
    <line x1="13" y1="28" x2="5"  y2="17"/>
    <!-- Spokes to hub -->
    <line x1="5"  y1="17" x2="18" y2="16"/>
    <line x1="12" y1="5"  x2="18" y2="16"/>
    <line x1="28" y1="16" x2="18" y2="16"/>
    <line x1="13" y1="28" x2="18" y2="16"/>
  </g>

  <!-- Outer nodes -->
  <circle cx="5"  cy="17" r="2.5" fill="#9FE1CB"/>
  <circle cx="12" cy="5"  r="2.5" fill="#9FE1CB"/>
  <circle cx="24" cy="7"  r="2"   fill="#9FE1CB"/>
  <circle cx="28" cy="16" r="3"   fill="#9FE1CB"/>
  <circle cx="24" cy="25" r="2"   fill="#9FE1CB"/>
  <circle cx="13" cy="28" r="2.5" fill="#9FE1CB"/>

  <!-- Hub — outer ring -->
  <circle cx="18" cy="16" r="4.5" fill="#E24B4A"/>
  <!-- Hub — status dot (change fill to indicate connection state) -->
  <circle cx="18" cy="16" r="2.2" fill="#5DCAA5"/>
</svg>
