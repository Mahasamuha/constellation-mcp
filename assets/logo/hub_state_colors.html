<style>
.ibg{background:#04342C;display:flex;align-items:center;justify-content:center;border-radius:20px}
.lbl{font-size:12px;color:var(--color-text-secondary);text-align:center;margin-top:7px}
.hex{font-family:var(--font-mono);font-size:11px;color:var(--color-text-tertiary);text-align:center;margin-top:2px}
</style>
<div id="r" style="padding:1rem 0;"></div>
<script>
function ico(ho,hi,sz){
const s=Math.round(sz*0.72);
return `<svg width="${s}" height="${s}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g stroke="#5DCAA5" stroke-width="1.8" fill="none" opacity="0.65"><line x1="10" y1="48" x2="32" y2="10"/><line x1="32" y1="10" x2="70" y2="16"/><line x1="70" y1="16" x2="90" y2="45"/><line x1="90" y1="45" x2="76" y2="80"/><line x1="76" y1="80" x2="37" y2="90"/><line x1="37" y1="90" x2="10" y2="48"/><line x1="32" y1="10" x2="55" y2="47"/><line x1="90" y1="45" x2="55" y2="47"/><line x1="37" y1="90" x2="55" y2="47"/><line x1="10" y1="48" x2="55" y2="47"/></g><circle cx="10" cy="48" r="5" fill="#9FE1CB"/><circle cx="32" cy="10" r="5" fill="#9FE1CB"/><circle cx="70" cy="16" r="4" fill="#9FE1CB"/><circle cx="90" cy="45" r="6" fill="#9FE1CB"/><circle cx="76" cy="80" r="4" fill="#9FE1CB"/><circle cx="37" cy="90" r="5" fill="#9FE1CB"/><circle cx="55" cy="47" r="10" fill="${ho}"/><circle cx="55" cy="47" r="5" fill="${hi}"/></svg>`;
}
const states=[
  ['green',   '#27500A','#97C459'],
  ['yellow',  '#412402','#FAC775'],
  ['grey',    '#444441','#B4B2A9'],
  ['red',     '#791F1F','#F09595'],
  ['orange',  '#712B13','#F0997B'],
];
let h='<div style="display:flex;gap:20px;">';
for(const[l,ho,hi] of states){
  h+=`<div style="display:flex;flex-direction:column;align-items:center;">
<div class="ibg" style="width:96px;height:96px;">${ico(ho,hi,96)}</div>
<span class="lbl">${l}</span>
<span class="hex">${hi}</span>
<span class="hex">${ho}</span>
</div>`;
}
h+='</div>';
document.getElementById('r').innerHTML=h;
</script>
